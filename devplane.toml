# Devplane's own gates, so this repository is governed by the thing it ships.

[project]
name        = "devplane"
base_branch = "main"

[gates]
# `cargo test` never rebuilds examples, and the conformance suite needs the ACP fixture.
check = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo build --examples --locked",
  # Includes `tests/removable.rs`, run against this repository.
  "cargo test --locked",
  # The interface.
  "cd ui && npm run build",
  "cd ui && npm run check",
  "cd ui && npm run render",
]
timeout             = "20m"
on_fail             = "feedback"
max_feedback_rounds = 2

# Run by name only: needs the gitignored `concepts/`, so it stays out of `check`.
[gates.named.notes]
run     = ["bash scripts/concepts-check.sh"]
timeout = "10m"

# Where the plans live and what marks an open question; neither has a default.
[spec]
plans          = "specs"
open_questions = ["NEEDS CLARIFICATION"]

[policy]
# Devplane only refuses or defers; grants belong in the agent's settings.json.
never_auto = ["Read(.env)", "Bash(rm -rf *)"]
always_ask = ["Bash(git push *)"]

# Review order, costliest mistakes first. A file takes the first matching role,
# so the security files under `src/core/` are excluded from logic by name.
[review.roles]
shared      = ["src/core/event.rs", "src/core/change.rs", "src/schema.sql", "ui/src/wire/**"]
logic       = ["src/core/**", "!src/core/policy.rs", "!src/core/command.rs"]
security    = ["src/core/policy.rs", "src/core/command.rs", "src/record.rs", "src/api.rs"]
integration = ["src/acp/**", "src/observe/**", "src/git.rs"]
wiring      = ["src/cli/**", "src/view.rs", "ui/src/**"]
tests       = ["tests/**", "site/**", "*.md"]
