# Devplane's own gates, so this repository is governed by the thing it ships.

[project]
name        = "devplane"
base_branch = "main"

[gates]
# What an agent can break and a person would otherwise find out about later.
# `cargo build --examples` before `cargo test`, which never rebuilds them, and
# the conformance suite needs the ACP fixture agent.
check = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo build --examples --locked",
  "cargo test --locked",
  # The interface. It is half this product, so a gate that skips it says done
  # while the build is about to fail.
  "cd ui && npm run build",
  "cd ui && npm run check",
  "cd ui && npm run render",
]
timeout             = "20m"
on_fail             = "feedback"
max_feedback_rounds = 2

# Asked for by name: the guards that keep the notes honest about the tree.
# Kept out of `check` deliberately — they need `concepts/`, which is gitignored,
# so they pass vacuously in a clean checkout and would make `check` a weaker
# claim than it looks.
[gates.named.notes]
run     = ["bash scripts/concepts-check.sh"]
timeout = "10m"

# Where the plans are and what marks an unanswered question in one. Both have
# no default: the layouts and the vocabulary are the repository's, and guessing
# either would be modelling somebody else's methodology.
[spec]
plans          = "specs"
open_questions = ["NEEDS CLARIFICATION"]

[policy]
# Devplane only ever refuses or defers. Grants belong in the agent's own
# settings.json, which is the file that enforces them.
never_auto = ["Read(.env)", "Bash(rm -rf *)"]
always_ask = ["Bash(git push *)"]
