<!doctype html>
<meta charset="utf-8">
<!--
  The Open Graph card, as a page rather than a picture.

  It is what every shared link and search result shows, so it carries the
  product's name — which means a rename silently invalidates it. It was a
  hand-made PNG and said "Vibeplane" for as long as nobody looked. Here it is
  markup, `scripts/make-og.sh` renders it at 1200×630, and the wordmark is one
  string rather than pixels.
-->
<title>Open Graph card</title>
<style>
  :root {
    --bg: #0b0c0e;
    --bg-sunk: #101215;
    --line: #24282e;
    --ink: #e7e9ec;
    --ink-soft: #a4aab4;
    --ink-faint: #767d88;
    --accent: #6ea8ff;
    --signal: #e8a33d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.5 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    border-top: 6px solid var(--signal);
  }
  .mark { display: flex; align-items: center; gap: 18px; }
  .mark svg { width: 46px; height: 46px; display: block; }
  .mark b { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  h1 {
    margin-top: 62px;
    font-size: 66px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.028em;
  }
  h1 span { color: var(--accent); }
  p.lede { margin-top: 26px; font-size: 25px; color: var(--ink-soft); }
  .term {
    margin-top: auto;
    background: var(--bg-sunk);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 26px;
    font: 400 21px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-soft);
  }
  .term .p { color: var(--ink-faint); }
  .term .n { color: var(--ink); font-weight: 600; }
  .term .w { color: var(--signal); }
</style>

<div class="mark">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#15181c"/>
    <rect x="7" y="8" width="18" height="2.6" rx="1.3" fill="#e7e9ec" opacity=".35"/>
    <rect x="7" y="14.7" width="18" height="2.6" rx="1.3" fill="#e8a33d"/>
    <rect x="7" y="21.4" width="18" height="2.6" rx="1.3" fill="#e7e9ec" opacity=".35"/>
  </svg>
  <b>Devplane</b>
</div>

<h1>See every coding agent<br><span>on your machine.</span></h1>
<p class="lede">The local-first control plane for AI coding agents.</p>

<div class="term">
  <div><span class="p">$</span> devplane ls</div>
  <div><span class="n">8 projects</span> · 23 sessions · 5 working · <span class="w">2 need you</span></div>
</div>
