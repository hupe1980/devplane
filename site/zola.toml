base_url = "https://hupe1980.github.io/devplane"
title = "Devplane"
description = "Devplane — know when an agent's work is actually done. Run any ACP agent in its own worktree, verify its change with your own checks run outside the agent, see the weakened tests first, and keep the record of who decided what. Local-first, one binary, and it never approves a tool call."
default_language = "en"
author = "hupe1980"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

hard_link_static = false

taxonomies = []

[markdown]
smart_punctuation = true
github_alerts = true
# So a reader can link to a section rather than to the page.
insert_anchor_links = "heading"
bottom_footnotes = true

[markdown.highlighting]
# Classes, not inline styles, so the theme toggle reaches code blocks too.
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[link_checker]
# A broken internal link fails the build. External ones only warn: they break
# for reasons outside this repository, and CI that goes red for those is ignored.
internal_level = "error"
external_level = "warn"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
tagline = "Know when an agent's work is actually done."
repo = "https://github.com/hupe1980/devplane"
acp = "https://agentclientprotocol.com"
version = "0.11.0"
og_image = "/og.png"

[[extra.nav]]
name = "Docs"
url = "/docs/"

[[extra.nav]]
name = "Install"
url = "/docs/install/"

[[extra.nav]]
name = "GitHub"
url = "https://github.com/hupe1980/devplane"
external = true
