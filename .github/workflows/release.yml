# Turns a tag into installable artifacts via `dist`; configured in
# `[workspace.metadata.dist]` in Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]
  # Plans the release without building it.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag releases only a commit CI passed on. If CI is still running for it,
  # this waits (up to 45 minutes); if it failed, was cancelled or never ran,
  # nothing is built. A manual run only plans, so it skips this.
  ci-green:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 90); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --json status,conclusion,url --limit 1 --jq '.[0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              echo "ci on $SHA: $conclusion — $(jq -r .url <<<"$run")"
              [ "$conclusion" = success ] && exit 0
              exit 1
            fi
            sleep 30
          done
          echo "no finished ci run for $SHA after 45 minutes"
          exit 1

  plan:
    needs: ci-green
    # Runs after a green gate, or alone on a manual plan (the gate is skipped).
    if: always() && (needs.ci-green.result == 'success' || needs.ci-green.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # The only part that runs on a manual trigger.
      - name: Plan
        run: dist plan --output-format=json | tee dist-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plan
          path: dist-plan.json
      # Catch a bad manifest before artifacts are built. The UI bundle is
      # committed and reproducible, so a rebuild that differs means it is stale.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The committed interface is the one the sources produce
        run: |
          cd ui && npm ci && npm run build
          cd .. && git diff --exit-code -- ui/dist
      - name: Check the crate is publishable
        run: cargo publish --dry-run --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Native ARM: `musl-gcc` only targets the host architecture.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # `build.rs` embeds the bundle but tolerates its absence, so every target
      # must build it before `dist build` or the binary serves no interface.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the interface
        shell: bash
        run: cd ui && npm ci && npm run build
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build
        shell: bash
        run: dist build --artifacts=local --target ${{ matrix.target }} --output-format=json > dist-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # Installers come from the manifest, not the binaries, so they build once.
      - name: Installers and checksums
        run: dist build --artifacts=global --output-format=json > dist-global.json
      # This version's section of CHANGELOG.md, as the release notes.
      - name: Release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          printf '\n**Install:** `curl -LsSf https://github.com/%s/releases/download/%s/devplane-installer.sh | sh`\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      # A draft: nothing is announced until every channel below can follow it.
      # Regular files only: skip dist's staging directories and manifests.
      - name: Upload to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done \
            < <(find target/distrib -maxdepth 1 -type f ! -name '*.json')
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts to publish"; exit 1; }
          printf 'uploading %s\n' "${files[@]}"
          # A re-run after a partial upload adds to the existing release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --draft \
              --title "${GITHUB_REF_NAME}" --notes-file notes.md "${files[@]}"
          fi

  # The release goes public once its artifacts are uploaded and crates.io has
  # the crate. npm follows it: its package installs from the release's assets,
  # so publishing it first would leave a window of 404s.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, crates-io]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing via OIDC; no npm token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Hand-written: dist's generated job is token-based. OIDC needs npm 11.5.1+ on Node 22.14.0+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: An npm new enough for OIDC
        run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # Built from the binaries' manifest, so versions and platforms match.
      - name: Build the npm package
        run: dist build --artifacts=global > /dev/null
      # No `--provenance`: OIDC attaches it. A missing package fails the release.
      - name: Publish to npm
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(target/distrib/*-npm-package.tar.gz)
          if [ ${#pkgs[@]} -ne 1 ]; then
            echo "expected exactly one npm package, found ${#pkgs[@]}" >&2
            printf '  %s\n' "${pkgs[@]}" >&2
            exit 1
          fi
          echo "publishing ${pkgs[0]}"
          npm publish --access public "${pkgs[0]}"

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing via OIDC; no crates.io token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # The UI bundle is committed and reproducible; a rebuild that differs means it is stale.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The committed interface is the one the sources produce
        run: |
          cd ui && npm ci && npm run build
          cd .. && git diff --exit-code -- ui/dist
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
