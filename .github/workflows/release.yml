# Turns a tag into installable artifacts. `dist` owns cross-compilation,
# checksums and the shell installer; its configuration
# lives in `[workspace.metadata.dist]` in Cargo.toml.
#
# A thin shim over the tool. `dist init` replaces this with its own generated
# workflow, which fans out per platform, and should be run before a real release.
name: release

on:
  push:
    tags: ["v*"]
  # Plans the release without building it, so a tag that would fail is known
  # before it is pushed.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # Reads the config and says what a release would contain. Cheap, and the
      # only part that runs on a manual dispatch.
      - name: Plan
        run: dist plan --output-format=json | tee dist-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plan
          path: dist-plan.json
      # crates.io rejects a bad manifest only at publish time, which is after
      # the tag is pushed and the artifacts are built.
      # **The bundle is committed, so this checks it rather than making it.**
      # `cargo publish` packages what is in git; a bundle rebuilt here would be
      # content the published crate carries and no commit contains, which is
      # the opposite of what this product asks of everybody else. The build is
      # byte-reproducible, so a difference means the committed bundle is stale.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The committed interface is the one the sources produce
        run: |
          cd ui && npm ci && npm run build
          cd .. && git diff --exit-code -- ui/dist
      - name: Check the crate is publishable
        run: cargo publish --dry-run --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the same Apple Silicon runner: the SDK carries
          # both slices, so `libsqlite3-sys` builds with no extra toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
          # Native ARM rather than a cross toolchain: `libsqlite3-sys` is C, and
          # `musl-gcc` only targets the host architecture.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # **The interface is built here, or the release ships without one.**
      #
      # `build.rs` treats a missing bundle as `None` rather than as a build
      # failure, which is right — a clean checkout with no node still compiles.
      # It also means a release job that forgets this step produces a binary
      # that serves nothing, silently, and the first person to notice is
      # somebody who installed it.
      #
      # Every target needs it: the bundle is embedded at compile time, so it
      # has to exist before `dist build` runs on each one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the interface
        shell: bash
        run: cd ui && npm ci && npm run build
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build
        shell: bash
        run: dist build --artifacts=local --target ${{ matrix.target }} --output-format=json > dist-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # The installers are generated from the manifest, not from the binaries,
      # so they are produced here rather than per platform.
      - name: Installers and checksums
        run: dist build --artifacts=global --output-format=json > dist-global.json
      # Only regular files: `dist` stages each archive as a directory beside it,
      # and the manifests are build output rather than something to publish.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done \
            < <(find target/distrib -maxdepth 1 -type f ! -name '*.json')
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts to publish"; exit 1; }
          printf 'publishing %s\n' "${files[@]}"

          # A run that failed partway through upload has already created the
          # release, so re-running must add to it rather than fail on the name.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Install: \`curl -LsSf https://github.com/hupe1980/devplane/releases/latest/download/devplane-installer.sh | sh\`" \
              "${files[@]}"
          fi

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # **Trusted publishing, exactly as crates.io below.** npm mints a
      # short-lived credential from this workflow's own OIDC identity, so no
      # registry token is stored in this repository. The trust is configured on
      # the npm side against `hupe1980/devplane` and this file.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Hand-written because `dist`'s generated `publish-npm` is token-shaped:
      # no `permissions:`, Node 20.x, `NODE_AUTH_TOKEN`.
      #
      # OIDC needs npm 11.5.1+ on Node 22.14.0+; `npm stage` would need 11.15.0+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: An npm new enough for OIDC
        run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      # Built from the same manifest the binaries came from, so the published
      # shim and the release cannot disagree about versions or platforms.
      - name: Build the npm package
        run: dist build --artifacts=global > /dev/null
      # No `--provenance`: OIDC attaches the attestation itself.
      #
      # Fails the release if the package is missing or the publish is refused —
      # shipping one door and not the other silently is worse than stopping.
      - name: Publish to npm
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(target/distrib/*-npm-package.tar.gz)
          if [ ${#pkgs[@]} -ne 1 ]; then
            echo "expected exactly one npm package, found ${#pkgs[@]}" >&2
            printf '  %s\n' "${pkgs[@]}" >&2
            exit 1
          fi
          echo "publishing ${pkgs[0]}"
          npm publish --access public "${pkgs[0]}"

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: crates.io mints a short-lived token from this
      # workflow's identity, so no registry token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # **The bundle is committed, so this checks it rather than making it.**
      # `cargo publish` packages what is in git; a bundle rebuilt here would be
      # content the published crate carries and no commit contains, which is
      # the opposite of what this product asks of everybody else. The build is
      # byte-reproducible, so a difference means the committed bundle is stale.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The committed interface is the one the sources produce
        run: |
          cd ui && npm ci && npm run build
          cd .. && git diff --exit-code -- ui/dist
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
