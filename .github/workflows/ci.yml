# Builds and checks the Rust half.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Process tables, signals and editor windows differ per platform.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # `--all-features` compiles the app, which needs WebKitGTK on Linux.
      - name: Install the app's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Node is pinned here, not assumed from the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the interface
        run: cd ui && npm ci && npm run build && git status --porcelain -- dist && test -z "$(git status --porcelain -- dist)"

      # Fails when the checked-in wire types differ from what Rust generates —
      # a new type included: `git diff` alone never sees an untracked file.
      - name: Check the generated wire types
        run: |
          TS_RS_EXPORT_DIR=ui/src cargo test --features typescript --quiet export_bindings
          git status --porcelain -- ui/src/wire
          test -z "$(git status --porcelain -- ui/src/wire)"

      - name: Type-check the interface
        run: cd ui && npx svelte-check --tsconfig ./tsconfig.json

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` here, not in RUSTFLAGS, so dependency lints cannot fail CI.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `cargo test` does not rebuild examples; the conformance suite needs a fresh fixture.
      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

  # The `app` feature, on macOS (no display server needed; the tests open no window).
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - name: Build the app
        run: cargo build --locked --features app
      # The ACP fixture agent the app tests drive.
      - name: Build the fixture agent
        run: cargo build --locked --example echo_agent
      - name: Test the app's host
        run: cargo test --locked --features app --test app

  # Every target the release ships, built the way the release builds it, so a
  # tag is never the first build of anything. A test holds this matrix equal to
  # `[workspace.metadata.dist] targets`. Windows also runs clippy, which `test`
  # does not cover there yet.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the interface
        shell: bash
        run: cd ui && npm ci && npm run build
      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings

  # Separate so a failure reads as "a dependency arrived", not "this commit is wrong".
  # Checks that need the gitignored concepts/ run via `just notes`, not here.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency count
        run: bash scripts/deps-count.sh
