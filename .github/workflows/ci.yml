# Builds and checks the Rust half.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The product reads process tables, sends signals to process groups and
        # resolves editor windows, and does it differently per platform. Testing
        # one of them proves the least interesting third.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest thing that can fail.
      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` on the clippy invocation only. Setting it in `RUSTFLAGS`
      # would apply it to every dependency as well, so a new lint in a crate we
      # do not own would turn the build red for something nobody here can fix.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `cargo test` does not rebuild examples, so without this the protocol
      # suite would drive whatever `examples/echo_agent` was built last. The
      # suite refuses a fixture older than its source rather than passing.
      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

  # Kept separate: it is the one job whose failure means "the world changed
  # under us" rather than "this commit is wrong".
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dependency ledger, which is only honest if something recomputes it.
      - name: Dependency ledger
        run: bash scripts/deps-count.sh

      - name: Claims that need the vendored specs
        run: |
          if [ -d specs ]; then
            bash scripts/verify-claims.sh
          else
            echo "specs/ is gitignored and absent; nothing to verify here."
          fi
