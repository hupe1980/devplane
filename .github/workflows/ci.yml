# Builds and checks the Rust half.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Process tables, signals and editor windows differ per platform.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # `--all-features` compiles the app, which needs WebKitGTK on Linux.
      - name: Install the app's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Node is pinned here, not assumed from the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the interface
        run: cd ui && npm ci && npm run build && git diff --exit-code -- dist

      # Fails when the checked-in wire types differ from what Rust generates.
      - name: Check the generated wire types
        run: TS_RS_EXPORT_DIR=ui/src cargo test --features typescript --quiet export_bindings && git diff --exit-code -- ui/src/wire

      - name: Type-check the interface
        run: cd ui && npx svelte-check --tsconfig ./tsconfig.json

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` here, not in RUSTFLAGS, so dependency lints cannot fail CI.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `cargo test` does not rebuild examples; the conformance suite needs a fresh fixture.
      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

  # The `app` feature, on macOS (no display server needed; the tests open no window).
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - name: Build the app
        run: cargo build --locked --features app
      # The ACP fixture agent the app tests drive.
      - name: Build the fixture agent
        run: cargo build --locked --example echo_agent
      - name: Test the app's host
        run: cargo test --locked --features app --test app

  # What the Windows release builds, on every push, so a Windows-only break
  # surfaces here and not at a tag. Build and clippy only: the test suite still
  # carries Unix assumptions.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the interface
        shell: bash
        run: cd ui && npm ci && npm run build
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  # Separate so a failure reads as "a dependency arrived", not "this commit is wrong".
  # Checks that need the gitignored concepts/ run via `just notes`, not here.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency count
        run: bash scripts/deps-count.sh
