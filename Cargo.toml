[workspace]
resolver = "3"
members = [
    "crates/vibeplane",
    "crates/vibeplane-domain",
    "crates/vibeplane-core",
    "crates/vibeplane-store",
    "crates/vibeplane-observe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/vibeplane"
homepage = "https://vibeplane.dev"
authors = ["Frank Hübner <hupe@huebner-frank.de>"]
rust-version = "1.90"

[workspace.dependencies]
vibeplane-domain = { path = "crates/vibeplane-domain", version = "0.1.0" }
vibeplane-core = { path = "crates/vibeplane-core", version = "0.1.0" }
vibeplane-store = { path = "crates/vibeplane-store", version = "0.1.0" }
vibeplane-observe = { path = "crates/vibeplane-observe", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
# The client only ever talks to 127.0.0.1, so no TLS stack is linked at all.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
dirs = "7"
jiff = { version = "0.2", features = ["serde"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = true
