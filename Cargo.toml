[package]
name = "devplane"
description = "Records who decided, when nobody asked you — a person, a rule, a classifier, a timer, or nobody — across every project and every coding agent on your machine. Local-first, one binary, and it never approves a tool call."
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/devplane"
homepage = "https://hupe1980.github.io/devplane"
authors = ["hupe1980"]
readme = "README.md"
keywords = ["ai", "agents", "claude-code", "developer-tools", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
# The crate root is the repository root, so the published package is named
# explicitly rather than taking the site, the scripts and the CI with it.
# `ui/` is named file by file rather than as a directory: it is a node project
# now, and `/ui` swept 1 460 files of `node_modules` into the package.
include = [
  "/src",
  "/build.rs",
  # The built interface, not its sources: `build.rs` embeds `ui/dist` and reads
  # nothing else. The map is left out — four times the bundle, loaded by nothing.
  "/ui/dist/*.html",
  "/ui/dist/*.js",
  "/ui/dist/*.css",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

# One crate, at the repository root. `tests/purity.rs` enforces the rule a
# second one would have: nothing in `src/core/` may reach the outside world.
[workspace]

[lib]
name = "devplane"
path = "src/lib.rs"

[[bin]]
name = "devplane"
path = "src/main.rs"

# The fixture the protocol suite drives: a real agent process speaking real ACP,
# rather than a vendor's, so `cargo test` needs no subscription and no network.
[[example]]
name = "echo_agent"

# The interface's wire types are **generated** from the Rust shapes rather than
# hand-written beside them, because a second copy of a wire format is a second
# thing to keep true — and the one that drifts is always the copy.
#
# Optional and off by default, so it contributes **nothing** to the shipped
# binary: `scripts/deps-count.sh` measures `cargo tree --edges normal`, which
# does not traverse a feature nobody enabled. It is turned on by the one test
# that writes the bindings, and by CI.
[features]
default = []
typescript = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
agent-client-protocol = "2.2"
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
# Three calls, none of which touches an agent — the protocol crate owns those
# process groups: `setsid` to detach the daemon, `kill(pid, 0)` to ask whether
# an observed process still exists, and `kill(-pid, SIGKILL)` for a timed-out
# gate and its whole group. Already in the tree via `sqlx` and `dirs`.
libc = "0.2"
# The client only ever talks to 127.0.0.1, so no TLS stack is linked at all.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = "thin"
strip = true

# What `dist` builds release artifacts with.
[profile.dist]
inherits = "release"

# Artifacts, checksums and the shell installer. No macOS signing: `dist` signs
# Windows only, which is why `site/content/docs/install.md` documents `curl`
# rather than the releases page.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
# Unscoped: `npm-package` defaults to the crate's name, which is the name held
# on npm.
installers = ["shell", "npm"]
# npm publishes through trusted publishing, as crates.io already does here — no
# registry token is stored in this repository.
#
# The `npm` job in `release.yml` is **hand-written**: `dist` generates one with
# no `permissions:` block, Node 20.x and `NODE_AUTH_TOKEN`. OIDC needs
# `id-token: write`, npm 11.5.1+ and Node 22.14.0+, and no `--provenance` — it
# attaches the attestation itself.
publish-jobs = ["npm"]
# musl rather than gnu so one Linux artifact runs everywhere. `libsqlite3-sys`
# is C, so a musl build needs a musl C toolchain. dist renames a plain `musl`
# target to `musl-static` and offers it for `linux-gnu` and `linux-musl-dynamic`
# as well, which is what makes one Linux build reach every Linux user.
#
# `x86_64-apple-darwin` cross-compiles from the Apple Silicon runner with
# nothing but `rustup target add` — the C in `libsqlite3-sys` included.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# A pull request plans the release without building it.
pr-run-mode = "plan"
install-updater = false
# `.github/workflows/release.yml` is hand-written rather than generated by
# `dist init`, so dist must not refuse to build over the difference. The cost is
# that the workflow's matrix repeats `targets` above; a test holds them equal.
allow-dirty = ["ci"]
