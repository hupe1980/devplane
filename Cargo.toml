[package]
name = "devplane"
description = "The desktop workbench for spec-driven agentic development. Write the spec, dispatch any ACP agent, verify against your own gates, and keep the record of who decided what while you were not looking. One binary, local-first, no account."
version = "0.10.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/devplane"
homepage = "https://hupe1980.github.io/devplane"
authors = ["hupe1980"]
readme = "README.md"
keywords = ["ai", "agents", "claude-code", "developer-tools", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
# Explicit so the package leaves out the site, scripts, CI and `ui/node_modules`.
include = [
  "/src",
  "/build.rs",
  # The built interface only (what `build.rs` embeds); no source map.
  "/ui/dist/*.html",
  "/ui/dist/*.js",
  "/ui/dist/*.css",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

# One crate; `tests/purity.rs` keeps `src/core/` free of I/O instead.
[workspace]

[lib]
name = "devplane"
path = "src/lib.rs"

[[bin]]
name = "devplane"
path = "src/main.rs"

# The ACP agent the conformance suite drives: no subscription, no network.
[[example]]
name = "echo_agent"

# `typescript` generates the interface's wire types; off by default, so it adds
# nothing to the shipped binary or the dependency count.
[features]
default = []
typescript = ["dep:ts-rs"]
# The desktop app. Off by default so `cargo install devplane` links no WebKit.
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-opener",
]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
# The window loads the host's page over loopback; no Tauri IPC on the data path.
tauri = { version = "2.11", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
# `deep-link` so a second launch hands its URL to the app already running.
tauri-plugin-single-instance = { version = "2", optional = true, features = ["deep-link"] }
tauri-plugin-opener = { version = "2", optional = true }
agent-client-protocol = "2.2"
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
# Shell completions generated from the same `clap::Command` as the help.
clap_complete = "4"
dirs = "7"
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
# `kill(pid, 0)` liveness probes and killing a timed-out gate's process group.
libc = "0.2"
# Loopback only, so no TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Used by `build.rs` only under the `app` feature.
[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
lto = "thin"
strip = true

# What `dist` builds release artifacts with.
[profile.dist]
inherits = "release"

# `dist` signs Windows only, so the install docs recommend `curl` on macOS.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
# The npm package takes the crate's (unscoped) name.
installers = ["shell", "npm"]
# npm uses trusted publishing (OIDC, no stored token); the `npm` job in
# `release.yml` is hand-written because dist's generated one cannot do OIDC.
publish-jobs = ["npm"]
# Static musl so one Linux artifact runs everywhere; x86_64 macOS cross-compiles
# from the Apple Silicon runner.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# A pull request plans the release without building it.
pr-run-mode = "plan"
install-updater = false
# `release.yml` is hand-written; its matrix repeats `targets` and a test holds them equal.
allow-dirty = ["ci"]
