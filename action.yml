# Devplane verify: runs the base's `check` from devplane.toml on this pull
# request and leads the job summary with the checks the change weakened.
# Posts nothing to the pull request. Needs no token unless the `approvals`
# input is on; then the job's own token reads the pull request's reviews.
# Every input reaches the shell through `env:`, never through an expression in
# a script.
name: Devplane verify
description: >-
  Runs the base's `check` from devplane.toml on this pull request, leading the job summary with the
  checks the change weakened. Posts nothing to the pull request.
author: hupe1980
branding:
  icon: check-circle
  color: gray-dark

inputs:
  base:
    description: Branch or commit to compare against. Empty uses `devplane verify`'s default.
    default: ${{ github.base_ref }}
  version:
    description: >-
      Release to install, such as `v0.12.0`. Pinned: the default is the release this action shipped
      with, never whatever is newest.
    default: v0.12.0
  statement:
    description: Path to write the in-toto statement to. Empty writes none.
    default: ""
  sarif:
    description: >-
      Path to write a SARIF 2.1.0 file of the weakened rows and failing named tests to. Empty writes
      none. Nothing is uploaded; upload it in your own step.
    default: ""
  install:
    description: "`false` uses a `devplane` already on PATH."
    default: "true"
  approvals:
    description: >-
      `true` reads who approved the pull request with the job's token (needs pull-requests: read)
      and adds an Approvals section to the summary. Writes nothing.
    default: "false"

outputs:
  verdict:
    description: verified | failed | could_not_run
    value: ${{ steps.verify.outputs.verdict }}
  statement:
    description: The statement's path, or empty.
    value: ${{ steps.verify.outputs.statement }}
  sarif:
    description: The SARIF file's path, or empty.
    value: ${{ steps.verify.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Supported runner
      shell: bash
      env:
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
        INSTALL: ${{ inputs.install }}
      run: |
        if [ "$INSTALL" != "true" ]; then exit 0; fi
        case "$OS/$ARCH" in
          Linux/X64|Linux/ARM64|macOS/ARM64) ;;
          *)
            echo "Devplane's release archives cover Linux and Apple Silicon macOS runners; this is $OS/$ARCH." >&2
            exit 2
            ;;
        esac

    # The release's archive and its `.sha256`, checked before anything is
    # unpacked; no installer script is run.
    - name: Install devplane
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL: ${{ inputs.install }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        if [ "$INSTALL" != "true" ]; then
          command -v devplane >/dev/null || { echo "install is false and no devplane is on PATH" >&2; exit 2; }
          devplane --version
          exit 0
        fi
        case "$VERSION" in
          ""|*[!0-9A-Za-z.+-]*|v|[!v0-9]*) echo "version must be a release such as v0.12.0" >&2; exit 2 ;;
        esac
        case "$OS/$ARCH" in
          Linux/X64) target=x86_64-unknown-linux-musl ;;
          Linux/ARM64) target=aarch64-unknown-linux-musl ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
        esac
        archive="devplane-$target.tar.xz"
        url="https://github.com/hupe1980/devplane/releases/download/v${VERSION#v}/$archive"
        dir="$RUNNER_TEMP/devplane"
        mkdir -p "$dir"
        cd "$dir"
        curl --proto '=https' --tlsv1.2 -fLsS "$url" -o "$archive"
        curl --proto '=https' --tlsv1.2 -fLsS "$url.sha256" -o "$archive.sha256"
        # The digest only; the file name it carries is not trusted to say which file.
        sum="$(awk 'NR == 1 { print $1 }' "$archive.sha256")"
        case "$sum" in
          *[!0-9a-f]*|"") echo "$archive.sha256 holds no SHA-256 digest" >&2; exit 2 ;;
        esac
        [ ${#sum} -eq 64 ] || { echo "$archive.sha256 holds no SHA-256 digest" >&2; exit 2; }
        if command -v sha256sum >/dev/null; then
          printf '%s  %s\n' "$sum" "$archive" | sha256sum -c -
        else
          printf '%s  %s\n' "$sum" "$archive" | shasum -a 256 -c -
        fi
        tar -xJf "$archive"
        bin="$dir/devplane-$target"
        [ -x "$bin/devplane" ] || { echo "$archive holds no devplane-$target/devplane" >&2; exit 2; }
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/devplane" --version

    - name: Verify
      id: verify
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        STATEMENT: ${{ inputs.statement }}
        SARIF: ${{ inputs.sarif }}
        APPROVALS: ${{ inputs.approvals }}
        GITHUB_TOKEN: ${{ inputs.approvals == 'true' && github.token || '' }}
      run: |
        args=(verify --json)
        if [ -n "$BASE" ]; then args+=(--base "$BASE"); else echo "No base given: devplane verify uses origin/HEAD, else main."; fi
        if [ -n "$STATEMENT" ]; then args+=(--statement "$STATEMENT"); fi
        if [ -n "$SARIF" ]; then args+=(--sarif "$SARIF"); fi
        if [ "$APPROVALS" = "true" ]; then args+=(--approvals); fi
        out="$RUNNER_TEMP/devplane-verify.json"
        set +e
        devplane "${args[@]}" > "$out"
        status=$?
        set -e
        # The document, for the log; the summary is on the run's page. The
        # annotations went to stderr, which the runner reads.
        cat "$out"
        # Read as JSON, by its keys; a document that does not parse leaves both empty.
        verdict="$(jq -r '.verdict // empty' "$out" 2>/dev/null || true)"
        written="$(jq -r '.wrote.statement // empty' "$out" 2>/dev/null || true)"
        sarif="$(jq -r '.wrote.sarif // empty' "$out" 2>/dev/null || true)"
        case "$verdict" in verified|failed|could_not_run) ;; *) verdict="" ;; esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        # Only a statement this run wrote, never a file left at the path.
        if [ -n "$STATEMENT" ] && [ "$written" = "$STATEMENT" ]; then
          echo "statement=$STATEMENT" >> "$GITHUB_OUTPUT"
        else
          echo "statement=" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$SARIF" ] && [ "$sarif" = "$SARIF" ]; then
          echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
        else
          echo "sarif=" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
